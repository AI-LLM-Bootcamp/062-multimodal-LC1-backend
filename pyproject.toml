[project]
name = "061-multimodal-lc1-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = "3.13.11"
dependencies = [
    "fastapi (>=0.128.6,<0.129.0)",
    "uvicorn[standard] (>=0.40.0,<0.41.0)",
    "alembic (>=1.18.3,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "boto3 (>=1.42.45,<2.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "langchain (>=1.2.9,<2.0.0)",
    "langchain-openai (>=1.1.8,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-text-splitters (>=1.1.0,<2.0.0)",
    "pypdf (>=6.7.0,<7.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "unstructured-client (>=0.42.10,<0.43.0)",
    "langchain-unstructured (>=1.0.1,<2.0.0)",
    "pymupdf (>=1.25.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "061_multimodal_lc1_backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
